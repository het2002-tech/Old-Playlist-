<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">🎵 My Music</div>
  <input id="search" type="search" placeholder="Search songs..." aria-label="Search songs">
</header>

<main>
  <section class="hero">
    <div>
      <div class="eyebrow">YOUR MUSIC • YOUR PLAYER</div>
      <h1>Listen here.</h1>
      <p>All songs play directly inside your website. Add hundreds of songs through <b>songs.json</b>.</p>
    </div>
  </section>

  <section>
    <div class="section-title"><h2>All Songs</h2><span id="count"></span></div>
    <div id="songList" class="song-grid"></div>
    <div id="empty" class="empty" hidden>No songs found.</div>
  </section>
</main>

<footer class="player">
  <div class="now-playing">
    <img id="cover" class="mini-cover" src="assets/default-cover.svg" alt="">
    <div class="now-text">
      <strong id="nowTitle">Select a song</strong>
      <span id="nowArtist">Your playlist</span>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="prev" title="Previous">⏮</button>
      <button id="play" class="play-btn" title="Play/Pause">▶</button>
      <button id="next" title="Next">⏭</button>
    </div>
    <div class="progress-row">
      <span id="currentTime">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0">
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="volume"><span>🔊</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></div>
</footer>

<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
